<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bannis VRChat — VVs</title>
<link rel="shortcut icon" href="icon.png">
<style>
  :root{
    --bg:#0a0a12;
    --bg-gradient: radial-gradient(circle at 20% 0%, rgba(124,110,247,0.10), transparent 45%),
                   radial-gradient(circle at 80% 10%, rgba(93,230,176,0.06), transparent 40%),
                   #0a0a12;
    --surface:#15151f;
    --surface2:#1b1b28;
    --surface3:#20202f;
    --line:#292939;
    --line-soft:#20202c;
    --text:#e8e6f5;
    --muted:#7d7a95;
    --muted2:#585670;
    --accent:#8a7dff;
    --accent-soft:rgba(138,125,255,0.12);
    --accent2:#5de6b0;
    --danger:#f2576a;
    --danger-soft:rgba(242,87,106,0.10);
    --gold:#f4bf42;
    --radius:14px;
    --shadow:0 4px 20px rgba(0,0,0,0.35);
    --mono:'Cascadia Code','Consolas',monospace;
  }

  *{box-sizing:border-box}

  html{scroll-behavior:smooth}

  body{
    margin:0;
    background:var(--bg-gradient);
    background-attachment:fixed;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--text);
    min-height:100vh;
  }

  ::selection{background:var(--accent);color:#fff}

  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:10px}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent)}

  .wrap{max-width:920px;margin:0 auto;padding:40px 20px 60px}

  /* ── Header ─────────────────────────────────────────────────────── */
  .top{
    display:flex;justify-content:space-between;align-items:end;gap:20px;
    margin-bottom:28px;flex-wrap:wrap;
    padding-bottom:22px;
    border-bottom:1px solid var(--line-soft);
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .brand img{
    width:30px;height:30px;border-radius:50%;
    box-shadow:0 0 0 2px var(--surface), 0 0 0 3px var(--accent-soft);
  }
  .brand span{
    font-weight:700;color:var(--accent);font-size:13px;
    letter-spacing:.08em;text-transform:uppercase;
  }
  h1{
    margin:0;font-size:28px;letter-spacing:-.6px;font-weight:800;
    display:flex;align-items:center;gap:10px;
  }
  .sub{margin-top:8px;color:var(--muted);font-size:14px;font-weight:400}
  .count{
    font-weight:700;font-size:13px;white-space:nowrap;color:var(--text);
    background:var(--surface2);
    border:1px solid var(--line);
    padding:8px 16px;
    border-radius:999px;
    box-shadow:var(--shadow);
  }

  /* ── Search ─────────────────────────────────────────────────────── */
  .search{position:relative;margin-bottom:26px}
  .search input{
    width:100%;height:50px;border:1px solid var(--line);
    border-radius:12px;padding:0 16px 0 46px;font-size:14.5px;outline:none;
    background:var(--surface);color:var(--text);
    transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .search input::placeholder{color:var(--muted2)}
  .search input:focus{
    border-color:var(--accent);
    background:var(--surface2);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .search span{
    position:absolute;left:16px;top:13px;font-size:18px;
    opacity:.75;pointer-events:none;
  }

  .list{display:grid;gap:18px}

  /* ── Carte façon embed Discord, améliorée ──────────────────────── */
  .card{
    background:linear-gradient(160deg, var(--surface) 0%, var(--surface2) 100%);
    border:1px solid var(--line);
    border-left:4px solid var(--danger);
    border-radius:var(--radius);
    padding:20px 22px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 100% 0%, var(--danger-soft), transparent 55%);
    pointer-events:none;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(0,0,0,0.45);
    border-color:#3a3a52;
  }

  .card-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .card-header img{width:20px;height:20px;border-radius:50%}
  .card-header span{
    font-size:11.5px;color:var(--muted);font-weight:700;
    text-transform:uppercase;letter-spacing:.05em;
  }
  .card-title{
    font-size:18px;font-weight:800;margin-bottom:16px;color:var(--text);
    display:flex;align-items:center;gap:8px;
  }

  .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;margin-bottom:16px}
  .field-label{
    font-size:10.5px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.06em;margin-bottom:4px;font-weight:700;
  }
  .field-value{font-size:14.5px;font-weight:500}
  .field-value a{
    color:var(--accent2);text-decoration:none;
    border-bottom:1px solid transparent;
    transition:border-color .15s ease;
  }
  .field-value a:hover{border-color:var(--accent2)}
  .field.full{grid-column:1 / -1}

  .history{
    display:flex;gap:8px;flex-wrap:wrap;font-size:12.5px;margin-bottom:16px;
    align-items:center;
  }
  .history > span:first-child{color:var(--muted);font-weight:600}
  .history b{color:var(--text)}
  .k-kick,.k-warn,.k-ban{
    padding:4px 10px;border-radius:999px;font-weight:700;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--line-soft);
  }
  .k-kick{color:var(--gold)}
  .k-warn{color:var(--gold)}
  .k-ban{color:var(--danger)}

  .detail{
    background:var(--surface3);
    border:1px solid var(--line-soft);
    border-radius:10px;
    padding:12px 14px;
    font-size:13.5px;
    color:var(--text);
    margin-bottom:16px;
    line-height:1.5;
  }

  .avatar-big{
    width:100%;max-width:440px;border-radius:12px;display:block;
    margin-bottom:16px;background:var(--surface2);
    border:1px solid var(--line-soft);
  }

  .footer-row{
    display:flex;justify-content:space-between;align-items:center;
    font-size:11.5px;color:var(--muted);margin-bottom:14px;
    flex-wrap:wrap;gap:6px;
    padding-top:12px;
    border-top:1px dashed var(--line-soft);
  }

  .profile-btn{
    display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--line);
    background:var(--surface3);
    border-radius:9px;padding:10px 16px;color:var(--text);
    text-decoration:none;font-size:13.5px;font-weight:600;
    transition:border-color .18s ease, background .18s ease, transform .12s ease;
  }
  .profile-btn:hover{
    border-color:var(--accent);
    background:var(--accent-soft);
    transform:translateY(-1px);
  }
  .profile-btn:active{transform:translateY(0)}

  /* ── Empty state ────────────────────────────────────────────────── */
  .empty{
    text-align:center;padding:52px 24px;color:var(--muted);
    background:var(--surface);border:1px dashed var(--line);
    border-radius:16px;font-size:14.5px;
  }

  /* ── Pagination ─────────────────────────────────────────────────── */
  .pages{display:flex;justify-content:center;gap:8px;margin-top:30px;flex-wrap:wrap}
  .pages button{
    border:1px solid var(--line);background:var(--surface);
    color:var(--text);border-radius:9px;padding:9px 14px;
    cursor:pointer;font-size:13px;font-weight:600;
    transition:all .15s ease;
  }
  .pages button.active{
    background:var(--accent);color:#fff;border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .pages button:hover:not(.active){
    border-color:var(--accent);
    background:var(--surface2);
  }

  @media(max-width:600px){
    .wrap{padding:26px 14px 40px}
    .fields{grid-template-columns:1fr}
    h1{font-size:23px}
    .card{padding:16px 16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="brand">
        <img src="https://cdn.discordapp.com/emojis/1463899019729309885.png" alt="">
        <span>VVs BOT</span>
      </div>
      <h1>🔴 Membres bannis</h1>
      <div class="sub">Bannissements actuels du groupe VRChat VVs</div>
    </div>
    <div class="count" id="count">0 membre</div>
  </div>

  <div class="search">
    <span>🔎</span>
    <input id="search" placeholder="Rechercher un utilisateur..." autocomplete="off">
  </div>

  <div id="list" class="list"></div>
  <div id="pages" class="pages"></div>
</div>

<script>
/*
  Les données viennent de bans.json, mis à jour automatiquement par le bot
  à chaque nouveau ban détecté sur le groupe VRChat.
*/
let BANS = [];

const PAGE_SIZE = 10;
let page = 1;
let filtered = BANS;

const list = document.getElementById("list");
const pages = document.getElementById("pages");
const search = document.getElementById("search");
const count = document.getElementById("count");

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&","<":"<",">":">",'"':""","'":"&#039;"
  }[c]));
}

async function loadBans(){
  try{
    const res = await fetch("./bans.json", { cache: "no-store" });
    if(!res.ok) throw new Error(res.status);
    BANS = await res.json();
  }catch(err){
    list.innerHTML = '<div class="empty">⚠️ Impossible de charger les données. Réessaie dans quelques instants.</div>';
    console.error("Erreur chargement bans.json :", err);
    return;
  }
  filtered = BANS;
  render();
}

function render(){
  const start=(page-1)*PAGE_SIZE;
  const items=filtered.slice(start,start+PAGE_SIZE);

  count.textContent=`${filtered.length} membre${filtered.length>1?"s":""}`;

  if(!items.length){
    list.innerHTML='<div class="empty">Aucun membre trouvé.</div>';
  }else{
    list.innerHTML=items.map(u=>{
      const stats = u.stats || { kick:0, warn:0, ban:0 };
      return `
      <div class="card">
        <div class="card-header">
          <img src="https://cdn.discordapp.com/emojis/1463899019729309885.png" alt="">
          <span>VVs Bot • Modération VRChat</span>
        </div>
        <div class="card-title">🔨 Ban VRChat</div>

        <div class="fields">
          <div class="field">
            <div class="field-label">👤 Membre VRChat</div>
            <div class="field-value"><a href="${escapeHtml(u.profile)}" target="_blank" rel="noopener">${escapeHtml(u.name)}</a></div>
          </div>
          <div class="field">
            <div class="field-label">🛡️ Modérateur VRChat</div>
            <div class="field-value">${escapeHtml(u.moderator || "?")}</div>
          </div>
        </div>

        <div class="history">
          <span>📊 Historique de ce membre</span>
          <span class="k-kick">Kick (${stats.kick})</span>
          <span class="k-warn">Warn (${stats.warn})</span>
          <span class="k-ban">Ban (${stats.ban})</span>
        </div>

        <div class="detail">📝 ${escapeHtml(u.reason)}</div>

        ${u.avatar ? `<img class="avatar-big" src="${escapeHtml(u.avatar)}" alt="">` : ""}

        <div class="footer-row">
          <span>VVs Bot${u.memberSince ? ` • Membre depuis le ${escapeHtml(u.memberSince)}` : ""}</span>
          <span>Banni le ${escapeHtml(u.date)}</span>
        </div>

        <a class="profile-btn" href="${escapeHtml(u.profile)}" target="_blank" rel="noopener">🔗 Voir le profil VRChat</a>
      </div>
    `;
    }).join("");
  }

  const total=Math.ceil(filtered.length/PAGE_SIZE);
  pages.innerHTML="";
  if(total<=1)return;
  for(let i=1;i<=total;i++){
    const b=document.createElement("button");
    b.textContent=i;
    b.className=i===page?"active":"";
    b.onclick=()=>{page=i;render()};
    pages.appendChild(b);
  }
}

search.addEventListener("input",()=>{
  const q=search.value.trim().toLowerCase();
  filtered=BANS.filter(u=>
    u.name.toLowerCase().includes(q) ||
    u.id.toLowerCase().includes(q)
  );
  page=1;
  render();
});

loadBans();
</script>
</body>
</html>
