<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Watch — VRChat Bans</title>
<style>
:root{--bg:#090a12;--panel:#111322;--panel2:#17192b;--line:#292d49;--ink:#f5f5ff;--muted:#8b90ac;--violet:#9a7cff;--green:#60f2ba;--red:#ff6680;--yellow:#ffd166;--shadow:0 18px 60px #0008}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--ink);font:15px/1.55 "Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 8% 0%,#251d4a 0,transparent 30rem),radial-gradient(circle at 100% 20%,#0c3b36 0,transparent 28rem),var(--bg);min-height:100vh}.wrap{width:min(1120px,calc(100% - 40px));margin:auto;padding:54px 0 70px}.eyebrow{color:var(--green);font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}.hero{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:32px}.hero h1{font:700 clamp(34px,6vw,64px)/.95 Georgia,serif;letter-spacing:-.06em;margin:10px 0 12px}.hero h1 span{color:var(--violet)}.intro{color:var(--muted);max-width:550px;margin:0}.status{border:1px solid #60f2ba55;color:var(--green);border-radius:999px;padding:8px 14px;font-size:12px;white-space:nowrap;background:#60f2ba0b}.status i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);margin-right:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.stat,.toolbar,.card,.empty{background:#111322dd;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px}.stat{padding:18px 20px;position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;right:-25px;bottom:-40px;background:var(--glow);filter:blur(18px);opacity:.35}.stat small{color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-size:10px}.stat strong{display:block;font-size:32px;margin-top:5px;color:var(--glow)}.toolbar{padding:13px;display:flex;gap:10px;margin-bottom:22px}.field{position:relative;flex:1}.field input,.field select{width:100%;height:44px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--ink);padding:0 14px;outline:0;font:inherit}.field input{padding-left:40px}.field input:focus,.field select:focus{border-color:var(--violet);box-shadow:0 0 0 3px #9a7cff1f}.search-icon{position:absolute;left:14px;top:10px;color:var(--muted)}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{padding:18px;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-3px);border-color:#9a7cff99}.card-top{display:flex;gap:14px;align-items:center}.avatar{width:58px;height:58px;object-fit:cover;border-radius:15px;background:var(--panel2);border:1px solid var(--line)}.identity{min-width:0;flex:1}.identity h2{margin:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.identity h2 a{color:var(--ink);text-decoration:none}.identity h2 a:hover{color:var(--green)}.id{color:var(--muted);font:11px ui-monospace,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mod{color:var(--violet);font-size:12px;margin:18px 0 10px}.reason{color:#d8daea;min-height:48px}.pills{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.pill{border-radius:999px;padding:4px 9px;font-size:11px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}.pill b{color:var(--ink)}.pill.ban{color:var(--red);border-color:#ff668055}.pill.warn{color:var(--yellow)}.pill.kick{color:var(--green)}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:13px}.profile{display:inline-block;margin-top:15px;color:var(--bg);background:var(--green);border-radius:10px;padding:8px 12px;text-decoration:none;font-weight:700;font-size:12px}.profile:hover{background:#93ffd5}.empty{grid-column:1/-1;padding:45px;text-align:center;color:var(--muted)}.error{color:var(--red)}mark{background:#ffe66d;color:#171314;border-radius:3px;padding:0 2px}.pages{display:flex;gap:8px;justify-content:center;margin-top:26px}.pages button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer}.pages button.active{background:var(--violet);border-color:var(--violet)}.skeleton{height:230px;border-radius:18px;background:linear-gradient(100deg,#111322 30%,#20243a 50%,#111322 70%);background-size:200% 100%;animation:shine 1.3s infinite}@keyframes shine{to{background-position:-200% 0}}@media(max-width:600px){.wrap{width:min(100% - 26px,560px);padding-top:30px}.hero{display:block}.status{display:inline-block;margin-top:20px}.stats{gap:8px}.stat{padding:14px 12px}.stat strong{font-size:26px}.toolbar{display:block}.field+.field{margin-top:9px}.list{grid-template-columns:1fr}.meta{display:block}.meta span{display:block;margin-top:3px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero"><div><div class="eyebrow">VVs / moderation log</div><h1>Neon <span>Watch</span></h1><p class="intro">Registre des membres bannis de la communauté VRChat. Les données sont chargées depuis <code>bans.json</code>.</p></div><div class="status"><i></i><span id="status">Connexion...</span></div></header>
  <section class="stats" aria-label="Statistiques globales"><div class="stat" style="--glow:var(--red)"><small>Total bans</small><strong id="totalBan">—</strong></div><div class="stat" style="--glow:var(--green)"><small>Total kicks</small><strong id="totalKick">—</strong></div><div class="stat" style="--glow:var(--yellow)"><small>Total warns</small><strong id="totalWarn">—</strong></div></section>
  <section class="toolbar" aria-label="Filtres"><label class="field"><span class="search-icon">⌕</span><input id="search" type="search" placeholder="Rechercher par nom..." autocomplete="off"></label><label class="field"><select id="moderator"><option value="">Tous les modérateurs</option></select></label><label class="field"><select id="sort"><option value="recent">Date récente</option><option value="oldest">Date ancienne</option><option value="most">Plus de bans</option><option value="least">Moins de bans</option></select></label></section>
  <section id="list" class="list" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div></section><nav id="pages" class="pages" aria-label="Pagination"></nav>
</main>
<script>
'use strict';
const PAGE_SIZE=10;let bans=[],page=1;
const $=id=>document.getElementById(id);const list=$('list'),pages=$('pages'),query=$('search'),moderator=$('moderator'),sort=$('sort');
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function dateValue(value){const p=String(value||'').split('/');return p.length===3?new Date(+p[2],+p[1]-1,+p[0]).getTime():0;}
function highlight(value){const text=esc(value),term=esc(query.value.trim());if(!term)return text;return text.replace(new RegExp('('+term.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>');}
function filtered(){const term=query.value.trim().toLowerCase(),mod=moderator.value;return bans.filter(u=>(!term||String(u.name||'').toLowerCase().includes(term))&&(!mod||u.moderator===mod)).sort((a,b)=>{if(sort.value==='most')return (b.stats?.ban||0)-(a.stats?.ban||0);if(sort.value==='least')return (a.stats?.ban||0)-(b.stats?.ban||0);return sort.value==='oldest'?dateValue(a.date)-dateValue(b.date):dateValue(b.date)-dateValue(a.date);});}
function card(u){const s={kick:0,warn:0,ban:0,...(u.stats||{})};return '<article class="card"><div class="card-top"><img class="avatar" src="'+esc(u.avatar)+'" alt="Avatar de '+esc(u.name)+'" loading="lazy" onerror="this.style.visibility=\'hidden\'"><div class="identity"><h2><a href="'+esc(u.profile)+'" target="_blank" rel="noopener">'+highlight(u.name)+'</a></h2><div class="id">'+esc(u.id)+'</div></div></div><div class="mod">▸ Modérateur : <b>'+esc(u.moderator||'—')+'</b></div><div class="reason">'+esc(u.reason||'Aucune raison renseignée.')+'</div><div class="pills"><span class="pill kick">KICK <b>'+String(Number(s.kick)||0)+'</b></span><span class="pill warn">WARN <b>'+String(Number(s.warn)||0)+'</b></span><span class="pill ban">BAN <b>'+String(Number(s.ban)||0)+'</b></span></div><div class="meta"><span>Banni le <b>'+esc(u.date)+'</b></span><span>Membre depuis <b>'+esc(u.memberSince||'—')+'</b></span></div><a class="profile" href="'+esc(u.profile)+'" target="_blank" rel="noopener">Voir le profil ↗</a></article>';}
function render(){const data=filtered(),total=Math.ceil(data.length/PAGE_SIZE);if(page>total)page=Math.max(1,total);const items=data.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);list.innerHTML=items.length?items.map(card).join(''):'<div class="empty">Aucun membre ne correspond à ces filtres.</div>';$('status').textContent=data.length+' résultat'+(data.length>1?'s':'');pages.innerHTML='';for(let i=1;i<=total;i++){const b=document.createElement('button');b.textContent=i;b.className=i===page?'active':'';b.setAttribute('aria-label','Page '+i);b.onclick=()=>{page=i;render();};pages.appendChild(b);}}
function update(){page=1;render();}
query.addEventListener('input',update);moderator.addEventListener('change',update);sort.addEventListener('change',update);
async function load(){try{const response=await fetch('./bans.json',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const json=await response.json();if(!Array.isArray(json))throw new Error('Le JSON doit être un tableau.');bans=json;[...new Set(bans.map(u=>u.moderator).filter(Boolean))].sort((a,b)=>a.localeCompare(b)).forEach(name=>{const option=document.createElement('option');option.value=name;option.textContent=name;moderator.appendChild(option);});$('totalBan').textContent=bans.reduce((n,u)=>n+Number(u.stats?.ban||0),0);$('totalKick').textContent=bans.reduce((n,u)=>n+Number(u.stats?.kick||0),0);$('totalWarn').textContent=bans.reduce((n,u)=>n+Number(u.stats?.warn||0),0);render();}catch(error){$('status').textContent='Erreur de chargement';list.innerHTML='<div class="empty error">Impossible de charger bans.json. Lancez un serveur local puis réessayez.</div>';console.error('Erreur chargement bans.json :',error);}}
load();
</script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v4513226cdae34746b4dedf0b4dfa099e1781791509496" integrity="sha512-ZE9pZaUXND66v380QUtch/5sE9tPFh2zg45pR2PB0CVkCtOREv2AJKkSidISWkysEuQ0EH8faUU5du78bx87UQ==" data-cf-beacon='{"version":"2024.11.0","token":"8607d2a720d14b038279025b2b5a82e5"}' crossorigin="anonymous"></script>
</body></html>
