<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bannis VRChat — VVs</title>
<style>
  :root{
    --bg:#f5f7f9; --card:#fff; --text:#172027; --muted:#68737b;
    --line:#e2e7ea; --accent:#5865f2; --danger:#d94b4b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
  .wrap{max-width:1050px;margin:0 auto;padding:28px}
  .top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}
  h1{margin:0;font-size:28px;letter-spacing:-.5px}
  .sub{margin-top:6px;color:var(--muted);font-size:14px}
  .count{font-weight:700;font-size:15px;white-space:nowrap}
  .search{position:relative;margin-bottom:18px}
  .search input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 16px 0 44px;font-size:15px;outline:none;background:#fff}
  .search input:focus{border-color:#b8c0ff;box-shadow:0 0 0 3px #5865f21a}
  .search span{position:absolute;left:15px;top:12px;font-size:20px}
  .list{display:grid;gap:12px}
  .person{display:flex;align-items:center;gap:15px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .avatar{width:58px;height:58px;border-radius:12px;object-fit:cover;background:#e9edf0;flex:0 0 58px}
  .info{min-width:0;flex:1}
  .name{font-weight:750;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{color:var(--muted);font-size:13px;margin-top:5px}
  .reason{margin-top:7px;font-size:13px}
  .badge{display:inline-block;margin-right:7px;padding:3px 8px;border-radius:999px;background:#fdecec;color:var(--danger);font-weight:700;font-size:11px}
  .profile{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;color:var(--text);text-decoration:none;font-size:13px;white-space:nowrap}
  .profile:hover{background:#f5f6f7}
  .empty{text-align:center;padding:42px;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:14px}
  .pages{display:flex;justify-content:center;gap:7px;margin-top:20px}
  .pages button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
  .pages button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  @media(max-width:600px){
    .wrap{padding:18px}.top{align-items:start}.count{font-size:13px}
    .person{align-items:flex-start}.profile{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>🔴 Membres bannis</h1>
      <div class="sub">Bannissements actuels du groupe VRChat</div>
    </div>
    <div class="count" id="count">0 membre</div>
  </div>

  <div class="search">
    <span>🔎</span>
    <input id="search" placeholder="Rechercher un utilisateur..." autocomplete="off">
  </div>

  <div id="list" class="list"></div>
  <div id="pages" class="pages"></div>
</div>

<script>
/*
  Les données viennent de bans.json, mis à jour automatiquement par le bot
  à chaque nouveau ban détecté sur le groupe VRChat.
*/
let BANS = [];

const PAGE_SIZE = 10;
let page = 1;
let filtered = BANS;

const list = document.getElementById("list");
const pages = document.getElementById("pages");
const search = document.getElementById("search");
const count = document.getElementById("count");

async function loadBans(){
  try{
    const res = await fetch("./bans.json", { cache: "no-store" });
    if(!res.ok) throw new Error(res.status);
    BANS = await res.json();
  }catch(err){
    list.innerHTML = '<div class="empty">⚠️ Impossible de charger les données. Réessaie dans quelques instants.</div>';
    console.error("Erreur chargement bans.json :", err);
    return;
  }
  filtered = BANS;
  render();
}

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function render(){
  const start=(page-1)*PAGE_SIZE;
  const items=filtered.slice(start,start+PAGE_SIZE);

  count.textContent=`${filtered.length} membre${filtered.length>1?"s":""}`;

  if(!items.length){
    list.innerHTML='<div class="empty">Aucun membre trouvé.</div>';
  }else{
    list.innerHTML=items.map(u=>`
      <div class="person">
        ${u.avatar
          ? `<img class="avatar" src="${escapeHtml(u.avatar)}" alt="">`
          : `<div class="avatar"></div>`}
        <div class="info">
          <div class="name">${escapeHtml(u.name)}</div>
          <div class="meta">${escapeHtml(u.id)} · Banni le ${escapeHtml(u.date)}</div>
          <div class="reason"><span class="badge">BANNI</span>${escapeHtml(u.reason)}</div>
        </div>
        <a class="profile" href="${escapeHtml(u.profile)}" target="_blank" rel="noopener">Profil VRChat ↗</a>
      </div>
    `).join("");
  }

  const total=Math.ceil(filtered.length/PAGE_SIZE);
  pages.innerHTML="";
  if(total<=1)return;
  for(let i=1;i<=total;i++){
    const b=document.createElement("button");
    b.textContent=i;
    b.className=i===page?"active":"";
    b.onclick=()=>{page=i;render()};
    pages.appendChild(b);
  }
}

search.addEventListener("input",()=>{
  const q=search.value.trim().toLowerCase();
  filtered=BANS.filter(u=>
    u.name.toLowerCase().includes(q) ||
    u.id.toLowerCase().includes(q)
  );
  page=1;
  render();
});

loadBans();
</script>
</body>
</html>
