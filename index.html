<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bannis VRChat — VVs</title>
<link rel="shortcut icon" href="icon.png">
<style>
  :root{
    --bg:#0a0a12;
    --surface:#15151f;
    --surface2:#1b1b28;
    --surface3:#20202f;
    --line:#292939;
    --text:#e8e6f5;
    --muted:#7d7a95;
    --accent:#8a7dff;
    --accent2:#5de6b0;
    --danger:#f2576a;
    --gold:#f4bf42;
    --radius:14px;
    --shadow:0 4px 20px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:
      radial-gradient(circle at 20% 0%, rgba(124,110,247,0.10), transparent 45%),
      radial-gradient(circle at 80% 10%, rgba(93,230,176,0.06), transparent 40%),
      var(--bg);
    background-attachment:fixed;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    color:var(--text);
    min-height:100vh;
  }
  ::-webkit-scrollbar{width:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:10px}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent)}

  .wrap{max-width:900px;margin:0 auto;padding:32px 20px}
  .top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .brand img{width:28px;height:28px;border-radius:50%}
  .brand span{font-weight:700;color:var(--accent);font-size:14px;letter-spacing:.04em}
  h1{margin:0;font-size:28px;letter-spacing:-.5px}
  .sub{margin-top:6px;color:var(--muted);font-size:14px}
  .count{font-weight:700;font-size:13px;white-space:nowrap;color:var(--text);background:var(--surface2);padding:8px 16px;border-radius:999px;border:1px solid var(--line);box-shadow:var(--shadow)}

  .search{position:relative;margin-bottom:24px}
  .search input{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 16px 0 44px;font-size:14px;outline:none;background:var(--surface);color:var(--text);transition:border-color .2s}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2, rgba(138,125,255,.15))}
  .search span{position:absolute;left:15px;top:13px;font-size:18px}

  .list{display:grid;gap:16px}

  .card{
    position:relative;
    background:linear-gradient(180deg,var(--surface),var(--surface2));
    border:1px solid var(--line);
    border-left:4px solid var(--danger);
    border-radius:var(--radius);
    padding:18px 20px;
    box-shadow:var(--shadow);
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;top:-40px;right:-40px;
    width:120px;height:120px;
    background:radial-gradient(circle, rgba(242,87,106,0.15), transparent 70%);
    pointer-events:none;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 28px rgba(0,0,0,0.45);
    border-color:#3a3a52;
  }

  .card-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .card-header img{width:20px;height:20px;border-radius:50%}
  .card-header span{font-size:12px;color:var(--muted);font-weight:600}
  .card-title{font-size:18px;font-weight:700;margin-bottom:16px;color:var(--text)}

  .fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;margin-bottom:16px}
  .field-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
  .field-value{font-size:14px}
  .field-value a{color:var(--accent2);text-decoration:none;font-weight:500}
  .field-value a:hover{text-decoration:underline}
  .field.full{grid-column:1 / -1}

  .history{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;margin-bottom:16px;align-items:center}
  .history b{color:var(--text)}
  .history span.pill{padding:4px 10px;border-radius:999px;font-weight:600}
  .k-kick{color:var(--gold);background:rgba(244,191,66,0.1)}
  .k-warn{color:var(--gold);background:rgba(244,191,66,0.1)}
  .k-ban{color:var(--danger);background:rgba(242,87,106,0.1)}

  .detail{background:var(--surface3);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--text);margin-bottom:16px;line-height:1.5}

  .avatar-big{width:100%;max-width:420px;border-radius:10px;display:block;margin-bottom:16px;background:var(--surface3)}

  .footer-row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:14px;flex-wrap:wrap;gap:6px;padding-top:12px;border-top:1px dashed var(--line)}

  .profile-btn{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--line);background:var(--surface3);
    border-radius:8px;padding:10px 16px;color:var(--text);
    text-decoration:none;font-size:13px;font-weight:500;
    transition:all .2s ease;
  }
  .profile-btn:hover{border-color:var(--accent);background:rgba(138,125,255,0.1);transform:translateX(2px)}

  .empty{text-align:center;padding:48px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}

  .pages{display:flex;justify-content:center;gap:8px;margin-top:28px}
  .pages button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:9px 14px;cursor:pointer;font-size:13px;transition:all .2s}
  .pages button.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(138,125,255,0.2)}
  .pages button:hover:not(.active){border-color:var(--accent)}

  @media(max-width:600px){
    .wrap{padding:20px 14px}
    .fields{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="brand">
        <img src="https://cdn.discordapp.com/emojis/1463899019729309885.png" alt="">
        <span>VVs BOT</span>
      </div>
      <h1>🔴 Membres bannis</h1>
      <div class="sub">Bannissements actuels du groupe VRChat VVs</div>
    </div>
    <div class="count" id="count">0 membre</div>
  </div>

  <div class="search">
    <span>🔎</span>
    <input id="search" placeholder="Rechercher un utilisateur..." autocomplete="off">
  </div>

  <div id="list" class="list"></div>
  <div id="pages" class="pages"></div>
</div>

<script>
let BANS = [];
const PAGE_SIZE = 10;
let page = 1;
let filtered = BANS;

const list = document.getElementById("list");
const pages = document.getElementById("pages");
const search = document.getElementById("search");
const count = document.getElementById("count");

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&","<":"<",">":">",'"':""","'":"&#039;"
  }[c]));
}

async function loadBans(){
  try{
    const res = await fetch("./bans.json", { cache: "no-store" });
    if(!res.ok) throw new Error(res.status);
    BANS = await res.json();
  }catch(err){
    list.innerHTML = '<div class="empty">⚠️ Impossible de charger les données. Réessaie dans quelques instants.</div>';
    console.error("Erreur chargement bans.json :", err);
    return;
  }
  filtered = BANS;
  render();
}

function render(){
  const start=(page-1)*PAGE_SIZE;
  const items=filtered.slice(start,start+PAGE_SIZE);

  count.textContent=`${filtered.length} membre${filtered.length>1?"s":""}`;

  if(!items.length){
    list.innerHTML='<div class="empty">Aucun membre trouvé.</div>';
  }else{
    list.innerHTML=items.map(u=>{
      const stats = u.stats || { kick:0, warn:0, ban:0 };
      return `
      <div class="card">
        <div class="card-header">
          <img src="https://cdn.discordapp.com/emojis/1463899019729309885.png" alt="">
          <span>VVs Bot • Modération VRChat</span>
        </div>
        <div class="card-title">🔨 Ban VRChat</div>

        <div class="fields">
          <div class="field">
            <div class="field-label">👤 Membre VRChat</div>
            <div class="field-value"><a href="${escapeHtml(u.profile)}" target="_blank" rel="noopener">${escapeHtml(u.name)}</a></div>
          </div>
          <div class="field">
            <div class="field-label">🛡️ Modérateur VRChat</div>
            <div class="field-value">${escapeHtml(u.moderator || "?")}</div>
          </div>
        </div>

        <div class="history">
          <span>📊 <b>Historique de ce membre</b></span>
          <span class="pill k-kick">Kick (${stats.kick})</span>
          <span class="pill k-warn">Warn (${stats.warn})</span>
          <span class="pill k-ban">Ban (${stats.ban})</span>
        </div>

        <div class="detail">📝 ${escapeHtml(u.reason)}</div>

        ${u.avatar ? `<img class="avatar-big" src="${escapeHtml(u.avatar)}" alt="">` : ""}

        <div class="footer-row">
          <span>VVs Bot${u.memberSince ? ` • Membre depuis le ${escapeHtml(u.memberSince)}` : ""}</span>
          <span>Banni le ${escapeHtml(u.date)}</span>
        </div>

        <a class="profile-btn" href="${escapeHtml(u.profile)}" target="_blank" rel="noopener">🔗 Voir le profil VRChat</a>
      </div>
    `;
    }).join("");
  }

  const total=Math.ceil(filtered.length/PAGE_SIZE);
  pages.innerHTML="";
  if(total<=1)return;
  for(let i=1;i<=total;i++){
    const b=document.createElement("button");
    b.textContent=i;
    b.className=i===page?"active":"";
    b.onclick=()=>{page=i;render()};
    pages.appendChild(b);
  }
}

search.addEventListener("input",()=>{
  const q=search.value.trim().toLowerCase();
  filtered=BANS.filter(u=>
    u.name.toLowerCase().includes(q) ||
    u.id.toLowerCase().includes(q)
  );
  page=1;
  render();
});

loadBans();
</script>
</body>
</html>
